name: Build AutoJs6 MCP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout AutoJs6 source
      uses: actions/checkout@v4
      with:
        repository: SuperMonster003/AutoJs6
        ref: master
        path: autojs6

    - name: Checkout MCP module
      uses: actions/checkout@v4
      with:
        path: mcp-module

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK manually
      run: |
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "SDK installed successfully"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    - name: Inject MCP module into AutoJs6
      run: |
        # Copy MCP source files
        mkdir -p autojs6/app/src/main/java/org/autojs/autojs/mcp
        cp -r mcp-module/src/* autojs6/app/src/main/java/org/autojs/autojs/mcp/
        
        # Add NanoHTTPD dependency to build.gradle.kts (NOT build.gradle)
        if ! grep -q "nanohttpd" autojs6/app/build.gradle.kts; then
          sed -i '/dependencies {/a\    implementation("org.nanohttpd:nanohttpd:2.3.1")' autojs6/app/build.gradle.kts
        fi
        
        # Register McpService in AndroidManifest
        if ! grep -q "McpService" autojs6/app/src/main/AndroidManifest.xml; then
          sed -i '/<\/application>/i\    <service android:name="org.autojs.autojs.mcp.McpService" android:exported="false"/>' autojs6/app/src/main/AndroidManifest.xml
        fi
        
        echo "MCP module injected"
        ls -la autojs6/app/src/main/java/org/autojs/autojs/mcp/
        grep -n "nanohttpd" autojs6/app/build.gradle.kts

    - name: Build Release APK
      run: |
        cd autojs6
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -50
      timeout-minutes: 30

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: autojs6-mcp-release
        path: autojs6/app/build/outputs/apk/release/*.apk
        retention-days: 7
